name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-conventions:
    name: PR conventions
    # Dependabot titles carry no issue number. GitHub reports a job skipped by
    # `if:` as successful, so a required check does not block these PRs.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check title format and linked issue
        shell: bash
        # Untrusted PR text is passed only through env and read as shell
        # variables; never interpolate it into the script (script injection).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          title_pattern='^(feat|fix|refactor|docs|chore|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+ \(#[0-9]+\)$'
          link_pattern='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:blank:]]+#[0-9]+'
          failed=0

          printf 'Title: %s\n' "$PR_TITLE"
          if [[ "$PR_TITLE" =~ $title_pattern ]]; then
            echo "Title follows type(scope): description (#issue)."
          else
            echo "::error title=PR title::Use 'type(scope): description (#issue)', e.g. 'ci: run checks on main trunk (#12)'. Types: feat, fix, refactor, docs, chore, test, ci, build, perf, style, revert."
            failed=1
          fi

          body="${PR_BODY,,}"
          if [[ "$body" =~ $link_pattern ]]; then
            echo "Body links an issue."
          else
            echo "::error title=Linked issue::Link the issue in the PR body, e.g. 'Closes #12' (Fixes and Resolves also work)."
            failed=1
          fi

          exit "$failed"
